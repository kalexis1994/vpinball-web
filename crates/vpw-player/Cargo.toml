[package]
name = "vpw-player"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
js-sys = "0.3.104"
log = "0.4.33"
vpw-math = { version = "0.1.0", path = "../vpw-math" }
vpw-physics = { version = "0.1.0", path = "../vpw-physics" }
vpw-game = { version = "0.1.0", path = "../vpw-game" }
vpw-render = { version = "0.1.0", path = "../vpw-render" }
vpin = "0.27.0"
vpw-table = { version = "0.1.0", path = "../vpw-table" }
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
web-sys = { version = "0.3.104", features = ["Window", "Document", "Element", "Node", "HtmlCanvasElement", "OffscreenCanvas", "Performance", "console"] }
wgpu = "30.0.0"
