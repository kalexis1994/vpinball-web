[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/kalexis1994/vpinball-web"

[workspace.dependencies]
vpw-arm7     = { path = "crates/vpw-arm7" }
vpw-at91     = { path = "crates/vpw-at91" }
vpw-math     = { path = "crates/vpw-math" }
vpw-physics  = { path = "crates/vpw-physics" }
vpw-render   = { path = "crates/vpw-render" }
vpw-vbscript = { path = "crates/vpw-vbscript" }
vpw-ws       = { path = "crates/vpw-ws" }

# Release profile for wasm: binary size and speed come first.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# The physics loop is unusable unoptimised, even in dev.
[profile.dev.package."*"]
opt-level = 3
[profile.dev]
opt-level = 1
# `cargo test --workspace` builds this profile, and with full debug info plus
# the incremental cache it comes to thirty gigabytes on this phone, rebuilt
# every time it is cleared — which is what fills the disk. Line tables are
# enough for a backtrace and nothing here is stepped through in a debugger.
debug = "line-tables-only"
incremental = false
